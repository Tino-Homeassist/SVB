<!doctype html>
<html lang="de" data-theme="hell" data-pwa="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A2550">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BW90 Kasse">
<title>Vereinskasse – SV Blau-Weiß 90 Wallwitz</title>
<style>
:root{
  --blau:#2A2550; --blau2:#3D6FE0; --hell:#DCE8FF; --gruen:#15803D; --gruen-hell:#E3F5E9; --rot:#C62828; --rot-hell:#FDECEC; --orange:#B45309; --orange-hell:#FEF3E2;
  --bg:#F3F4F8; --fl:#FFFFFF; --fl2:#F6F7FC; --rand:#D5D8EA; --rand2:#ECEEF6; --text:#2A2550; --leise:#5B5F80; --kopf:#2A2550; --kopftext:#FFFFFF;
  --r:12px;
}
[data-theme="dunkel"]{
  --bg:#12112A; --fl:#1D1B3D; --fl2:#25234A; --rand:#3A3870; --rand2:#2C2A55; --text:#F2F3FA; --leise:#AEB1D6; --kopf:#0B0A1F; --hell:#2B3F7A; --blau2:#7FA2FF;
  --gruen-hell:#173A26; --rot-hell:#4A1C22; --orange-hell:#4A3415;
}
html{font-size:16px}
html[data-size="gross"]{font-size:18px}
html[data-size="xgross"]{font-size:20px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Roboto,system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid var(--blau2);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

/* Kopf */
.kopf{flex:0 0 auto;min-height:4.4rem;background:var(--kopf);color:var(--kopftext);display:flex;align-items:center;gap:.7rem;padding:.4rem 1rem;flex-wrap:nowrap}
.vtitel{min-width:0;flex:0 1 auto}
.vname,.vsub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbtn{flex-shrink:0}
.wappen{background:#fff;border-radius:10px;padding:3px 6px;height:3.4rem;display:flex;align-items:center}
.wappen img{height:100%;width:auto;display:block}
.vname{font-size:1.2rem;font-weight:700;line-height:1.15}
.vsub{font-size:.8rem;color:#C9CCE6}
.chips{display:flex;gap:.5rem;flex-wrap:nowrap;margin-left:auto;min-width:0;overflow:hidden}
.chip{padding:.45rem .6rem;overflow:hidden;text-overflow:ellipsis;flex-shrink:1;min-width:0;border-radius:8px;background:rgba(255,255,255,.12);font-size:.85rem;white-space:nowrap}
.kbtn{height:3rem;padding:0 .9rem;border-radius:10px;border:1.5px solid rgba(255,255,255,.55);background:transparent;color:#fff;font-weight:600;display:flex;align-items:center;gap:.45rem;font-size:.95rem}
.kbtn.voll{background:#fff;color:#2A2550;border-color:#fff;font-weight:700}
.kbtn svg{width:1.2rem;height:1.2rem}

/* Verkauf */
.verkauf{flex:1 1 auto;display:flex;min-height:0}
.produkte{flex:1 1 auto;display:flex;flex-direction:column;gap:.9rem;padding:1rem 1.1rem;min-width:0;overflow-y:auto}
.tabs{display:flex;gap:.55rem;flex-wrap:wrap}
.tab{height:3.2rem;padding:0 1.3rem;border-radius:1.6rem;border:2px solid var(--rand);background:var(--fl);font-weight:600;font-size:1rem}
.tab[aria-pressed="true"]{border-color:var(--blau2);background:var(--hell);font-weight:700}
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:.8rem}
.kachel{position:relative;min-height:9rem;border-radius:14px;border:2px solid var(--rand);background:var(--fl);padding:.8rem .8rem .7rem;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;transition:transform .06s,border-color .1s}
.kachel:active{transform:scale(.97);border-color:var(--blau2)}
.kachel .sym{width:2.8rem;height:2.8rem;border-radius:10px;background:var(--fl2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.kachel .sym svg{width:1.8rem;height:1.8rem}
.kachel .sym img{width:100%;height:100%;object-fit:cover}
.kachel .pn{font-size:1.15rem;font-weight:600;line-height:1.2;margin-top:.4rem}
.kachel .pp{font-size:1.5rem;font-weight:800}
.kachel .pf{font-size:.8rem;color:var(--leise);margin-left:.4rem;font-weight:500}
.badge{position:absolute;top:.6rem;right:.6rem;min-width:2.1rem;height:2.1rem;padding:0 .5rem;border-radius:1.05rem;background:var(--blau2);color:#fff;font-weight:800;font-size:1.05rem;display:flex;align-items:center;justify-content:center}
.leerhinweis{padding:2rem;border:2px dashed var(--rand);border-radius:var(--r);text-align:center;color:var(--leise)}

.korb{flex:0 0 27.5rem;max-width:45vw;background:var(--fl);border-left:1px solid var(--rand);display:flex;flex-direction:column;min-height:0}
.korbkopf{padding:.9rem 1.2rem .5rem;display:flex;justify-content:space-between;align-items:center}
.korbkopf h2{margin:0;font-size:1.25rem}
.zeilen{flex:1 1 auto;overflow-y:auto;padding:0 .7rem;display:flex;flex-direction:column}
.zeile{display:flex;align-items:center;gap:.5rem;padding:.6rem .4rem;border-bottom:1px solid var(--rand2)}
.zeile .zn{flex:1 1 auto;min-width:0}
.zeile .zn b{display:block;font-size:1.05rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zeile .zn small{color:var(--leise);font-size:.8rem}
.mb{width:2.8rem;height:2.8rem;border-radius:10px;border:1.5px solid var(--rand);background:var(--fl);font-size:1.5rem;font-weight:600;line-height:1;display:flex;align-items:center;justify-content:center}
.mb.plus{border-color:var(--blau2);background:var(--hell)}
.zm{width:2rem;text-align:center;font-size:1.25rem;font-weight:700}
.zs{width:5rem;text-align:right;font-weight:700;font-size:1.05rem}
.del{width:2.3rem;height:2.8rem;border:none;background:transparent;color:var(--rot);display:flex;align-items:center;justify-content:center}
.del svg{width:1.25rem;height:1.25rem}
.pfz{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.55rem .6rem;margin-top:.4rem;border-radius:8px;background:var(--fl2);font-size:.95rem}
.pfz.rueck{background:var(--rot-hell);color:var(--rot)}
.korbfuss{padding:.8rem 1.2rem 1rem;border-top:2px solid var(--rand2);display:flex;flex-direction:column;gap:.7rem}
.zeilen-kv{display:flex;justify-content:space-between;color:var(--leise);font-size:.95rem}
.summe{display:flex;justify-content:space-between;align-items:baseline}
.summe span:first-child{font-size:1.25rem;font-weight:700}
.summe .gross{font-size:3rem;font-weight:800;letter-spacing:-.5px}
.zwei{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.btn{min-height:3.2rem;padding:0 1rem;border-radius:12px;border:2px solid var(--text);background:var(--fl);font-weight:700;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:.5rem}
.btn.klein{min-height:2.6rem;font-size:.9rem;padding:0 .8rem;border-width:1.5px}
.btn.rot{border-color:var(--rot);color:var(--rot)}
.btn.blau{border-color:var(--blau2);background:var(--hell)}
.btn.gruen{border:none;background:var(--gruen);color:#fff}
.btn.voll-rot{border:none;background:var(--rot);color:#fff}
.btn.leise{border-color:var(--rand);color:var(--text)}
.btn svg{width:1.3rem;height:1.3rem}
.kassieren{min-height:5rem;border-radius:14px;border:none;background:var(--gruen);color:#fff;font-size:1.6rem;font-weight:800;display:flex;align-items:center;justify-content:center;gap:.7rem}
.kassieren svg{width:1.9rem;height:1.9rem}
.fuss-hinweis{font-size:.75rem;color:var(--leise);text-align:center}

/* Dialoge */
.dlg-hg{position:fixed;inset:0;background:rgba(14,12,40,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:1rem}
.dlg{background:var(--fl);color:var(--text);border-radius:18px;max-width:min(64rem,100%);width:100%;max-height:calc(100vh - 2rem);overflow:auto;padding:1.4rem 1.6rem;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.dlg.schmal{max-width:34rem}
.dlg.mittel{max-width:46rem}
.dlg h2{margin:0 0 1rem;font-size:1.4rem}
.dlg-fuss{display:flex;justify-content:flex-end;gap:.6rem;margin-top:1.2rem;flex-wrap:wrap}
.zahlung{display:grid;grid-template-columns:minmax(0,1fr) 26rem;gap:1.4rem}
.feld{border-radius:14px;padding:.9rem 1.2rem;display:flex;flex-direction:column;gap:.3rem}
.feld .lbl{font-size:.95rem;font-weight:700;letter-spacing:1px;color:var(--leise)}
.feld .wert{font-size:3.4rem;font-weight:800;line-height:1.05}
.feld.zz{background:var(--fl2)}
.feld.er{border:2px solid var(--blau2)}
.feld.wg{background:var(--gruen);color:#fff}
.feld.wg .lbl{color:#D7F2DF}
.feld.wg.fehlt{background:var(--rot-hell);color:var(--rot)}
.feld.wg.fehlt .lbl{color:var(--rot)}
.feld.aus{background:var(--orange-hell);color:var(--orange)}
.schnell{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.schnell button{min-height:4rem;border-radius:12px;border:2px solid var(--text);background:var(--fl);font-size:1.35rem;font-weight:800}
.schnell button.an{border-color:var(--blau2);background:var(--hell)}
.ziffern{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem}
.ziffern button{min-height:3.6rem;border-radius:10px;border:1.5px solid var(--rand);background:var(--fl2);font-size:1.5rem;font-weight:600}
.art{display:flex;gap:.5rem;margin-bottom:.9rem}
.art button{height:3.1rem;padding:0 1.3rem;border-radius:1.55rem;border:2px solid var(--rand);background:var(--fl);font-weight:600}
.art button[aria-pressed="true"]{border-color:var(--blau2);background:var(--hell);font-weight:700}
.hinweisbox{border-radius:12px;padding:.8rem 1rem;background:var(--orange-hell);color:var(--orange);font-size:.95rem}
.hinweisbox.blau{background:var(--hell);color:var(--text)}
.hinweisbox.rot{background:var(--rot-hell);color:var(--rot)}

/* Formulare */
label.f{display:flex;flex-direction:column;gap:.3rem;font-size:.9rem;font-weight:600}
.inp,select.inp,textarea.inp{min-height:2.9rem;padding:.4rem .7rem;border-radius:10px;border:1.5px solid var(--rand);background:var(--fl);font-size:1.05rem;font-weight:500}
textarea.inp{min-height:5rem;resize:vertical}
.inp:focus{border-color:var(--blau2);outline:none}
.inp.fehler{border-color:var(--rot);background:var(--rot-hell)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem}
.check{display:flex;align-items:center;gap:.6rem;font-weight:600;min-height:2.8rem}
.check input{width:1.5rem;height:1.5rem}
.fehlertext{color:var(--rot);font-weight:600;font-size:.9rem}

/* Verwaltung */
.verw{flex:1 1 auto;display:flex;min-height:0}
.nav{flex:0 0 14rem;background:var(--fl);border-right:1px solid var(--rand);padding:1rem .7rem;display:flex;flex-direction:column;gap:.3rem;overflow-y:auto}
.nav button{text-align:left;min-height:3rem;padding:0 .9rem;border-radius:10px;border:none;background:transparent;font-weight:600;font-size:1rem}
.nav button[aria-current="page"]{background:var(--hell)}
.inhalt{flex:1 1 auto;overflow:auto;padding:1.2rem 1.5rem 2rem}
.inhalt h2{margin:0 0 .3rem;font-size:1.5rem}
.inhalt .lead{color:var(--leise);margin:0 0 1rem}
.karte{background:var(--fl);border:1px solid var(--rand);border-radius:14px;padding:1rem 1.2rem;margin-bottom:1rem}
.karte h3{margin:0 0 .7rem;font-size:1.1rem}
.leiste{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.8rem}
table.t{width:100%;border-collapse:collapse;font-size:.95rem}
table.t th{text-align:left;font-size:.8rem;color:var(--leise);font-weight:600;padding:.45rem .5rem;border-bottom:1.5px solid var(--rand)}
table.t td{padding:.45rem .5rem;border-bottom:1px solid var(--rand2);vertical-align:middle}
table.t td.r,table.t th.r{text-align:right}
table.t tr.inaktiv td{color:var(--leise);text-decoration:line-through}
table.t tr.inaktiv td.akt{text-decoration:none}
.ib{width:2.5rem;height:2.5rem;border-radius:8px;border:1.5px solid var(--rand);background:var(--fl);display:inline-flex;align-items:center;justify-content:center}
.ib svg{width:1.1rem;height:1.1rem}
.symwahl{display:flex;flex-wrap:wrap;gap:.4rem}
.symwahl button{width:3.2rem;height:3.2rem;border-radius:10px;border:2px solid var(--rand);background:var(--fl2);display:flex;align-items:center;justify-content:center}
.symwahl button[aria-pressed="true"]{border-color:var(--blau2);background:var(--hell)}
.symwahl svg{width:1.8rem;height:1.8rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(12rem,1fr));gap:.8rem;margin-bottom:1rem}
.kpi{background:var(--fl);border:1px solid var(--rand);border-radius:14px;padding:.9rem 1rem}
.kpi small{display:block;color:var(--leise);font-weight:600;font-size:.8rem}
.kpi b{font-size:1.6rem;font-weight:800}
.balken{display:flex;flex-direction:column;gap:.4rem}
.brow{display:grid;grid-template-columns:10rem 1fr 6.5rem;gap:.6rem;align-items:center;font-size:.9rem}
.bbar{height:1.3rem;border-radius:4px;background:var(--fl2);overflow:hidden}
.bbar i{display:block;height:100%;background:var(--blau2);border-radius:4px}
svg.chart text{fill:var(--leise);font-size:11px}

/* Abschluss */
.abschluss{flex:1 1 auto;overflow:auto;padding:1rem 1.2rem 2rem}
.ab-raster{display:grid;grid-template-columns:repeat(auto-fit,minmax(22rem,1fr));gap:1rem;align-items:start}
.zaehl{display:grid;grid-template-columns:1fr 5.5rem 7rem;gap:.35rem .6rem;align-items:center}
.zaehl input{height:2.6rem;text-align:center;font-weight:700}
.kv{display:flex;justify-content:space-between;gap:1rem;padding:.35rem 0}
.kv.summe2{font-weight:800;border-top:1.5px solid var(--rand);margin-top:.2rem;padding-top:.5rem}
.diff{border-radius:10px;padding:.7rem .9rem;font-weight:800;display:flex;justify-content:space-between;align-items:center;font-size:1.1rem}
.diff.ok{background:var(--gruen-hell);color:var(--gruen)}
.diff.minus{background:var(--rot-hell);color:var(--rot)}
.diff.plus{background:var(--orange-hell);color:var(--orange)}
.diff.na{background:var(--fl2);color:var(--leise);font-weight:600}

/* Toast */
.toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);width:max-content;max-width:92vw;background:var(--gruen);color:#fff;padding:1rem 1.6rem;border-radius:14px;font-size:1.2rem;font-weight:700;z-index:80;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.rot{background:var(--rot)}

/* Druck */
#druck{display:none}
@media print{
  @page{size:A4;margin:14mm 14mm 16mm}
  body{background:#fff;color:#000}
  #app,.dlg-hg,.toast{display:none!important}
  #druck{display:block;font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:10pt;color:#000}
}
.pr-kopf{display:flex;align-items:center;gap:12px;border-bottom:2px solid #2A2550;padding-bottom:8px;margin-bottom:10px}
.pr-kopf img{height:64px}
.pr-kopf h1{margin:0;font-size:16pt;color:#2A2550}
.pr-kopf div{font-size:9.5pt}
#druck h2{font-size:11.5pt;color:#2A2550;margin:12px 0 4px;border-bottom:1px solid #999}
#druck table{width:100%;border-collapse:collapse;font-size:9.5pt}
#druck td,#druck th{padding:2px 4px;border-bottom:1px solid #ddd;text-align:left}
#druck td.r,#druck th.r{text-align:right}
#druck .spalten{display:grid;grid-template-columns:1fr 1fr;gap:16px}
#druck .bem{border:1px solid #999;min-height:22mm;padding:4px;white-space:pre-wrap}
#druck .unter{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:22mm}
#druck .unter div{border-top:1px solid #000;padding-top:3px;font-size:9pt}
#druck .klein{font-size:8pt;color:#444;margin-top:8px}
#druck .fett td{font-weight:700}

@media (max-width:1100px){.kbtn{font-size:0;gap:0;padding:0 .75rem}.kbtn svg{width:1.3rem;height:1.3rem}}
@media (max-width:900px){
  .kopf{flex-wrap:wrap}
  .chips{order:5;width:100%;margin-left:0}
  .verkauf{flex-direction:column}
  .korb{flex:0 0 auto;max-width:none;border-left:none;border-top:1px solid var(--rand);max-height:55vh}
  .zahlung{grid-template-columns:1fr}
  .nav{flex-basis:11rem}
}

/* ---------- Smartphone (bis 700 px) ---------- */
.nur-mobil{display:none!important}
.menueliste{display:flex;flex-direction:column;gap:.5rem}
.menuepunkt{justify-content:flex-start!important;min-height:3.5rem!important;font-size:1.05rem!important;text-align:left}
.schritte{padding-left:1.3rem;line-height:1.55;font-size:1.02rem}
.schritte li{margin-bottom:.45rem}
.kbtn.menue{position:relative}
.punkt{position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:5px;background:#FCD34D}
.feld .wert.klein{font-size:1.6rem}
.feld .wert.wg-gross{font-size:4rem}
@media (max-width:700px){
  .nur-mobil{display:flex!important}
  .vsub.nur-mobil{display:block!important}
  .nur-desk{display:none!important}
  .kopf{min-height:3.6rem;gap:.55rem;padding:.35rem .6rem;padding-top:calc(.35rem + env(safe-area-inset-top));padding-left:calc(.6rem + env(safe-area-inset-left));padding-right:calc(.6rem + env(safe-area-inset-right))}
  .kopf{flex-wrap:nowrap}
  .kopf .chips,.kopf .kbtn:not(.menue){display:none!important}
  .dlg-fuss{flex-wrap:nowrap}
  .dlg-fuss .zurueck-btn{flex:0 0 3.6rem;padding:0}
  .dlg-fuss .zurueck-btn span{display:none}
  .dlg-fuss #fertig{flex:1 1 auto}
  .kbtn.menue{font-size:0;padding:0;width:3rem;height:3rem;justify-content:center;margin-left:auto}
  .kbtn.menue + .kbtn.menue{margin-left:0}
  .kbtn.menue svg{width:1.5rem;height:1.5rem}
  .wappen{height:2.7rem;padding:2px 4px}
  .vtitel{flex:1 1 auto}
  .vname{font-size:1rem}
  .vsub{font-size:.78rem}
  .verkauf{flex-direction:column}
  .produkte{padding:.6rem .6rem calc(6.6rem + env(safe-area-inset-bottom));gap:.6rem}
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -.6rem;padding:0 .6rem}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;height:2.8rem;padding:0 1rem;font-size:.95rem}
  .raster{grid-template-columns:repeat(2,minmax(0,1fr));gap:.55rem}
  .kachel{min-height:7.2rem;padding:.6rem .65rem}
  .kachel .sym{width:2.3rem;height:2.3rem}
  .kachel .sym svg{width:1.5rem;height:1.5rem}
  .kachel .pn{font-size:1.02rem;margin-top:.3rem}
  .kachel .pp{font-size:1.3rem}
  .badge{top:.45rem;right:.45rem;min-width:1.9rem;height:1.9rem}
  .korb-hg{position:fixed;inset:0;background:rgba(14,12,40,.35);z-index:19}
  .korb{position:fixed;left:0;right:0;bottom:0;flex:none;max-width:none;max-height:85dvh;border-left:none;border-top:1px solid var(--rand);border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(20,16,60,.18);z-index:20}
  .korb .korbkopf,.korb .zeilen,.korb .korbfuss>*:not(.mobil-leiste){display:none!important}
  .korb.offen .korbkopf{display:flex!important;padding:.8rem 1rem .3rem}
  .korb.offen .zeilen{display:flex!important;max-height:52dvh}
  .korb.offen .korbfuss .zwei{display:grid!important}
  .korbfuss{border-top:none;padding:.55rem .7rem calc(.55rem + env(safe-area-inset-bottom));gap:.55rem}
  .korb.offen .korbfuss{border-top:2px solid var(--rand2)}
  .mobil-leiste{align-items:center;gap:.5rem}
  .korb-toggle{display:flex;align-items:center;gap:.35rem;min-height:3.4rem;padding:0 .7rem;border-radius:12px;border:1.5px solid var(--rand);background:var(--fl2);font-weight:600;font-size:.9rem;white-space:nowrap}
  .korb-toggle svg{width:1.2rem;height:1.2rem}
  .msumme{margin-left:auto;font-size:1.65rem;font-weight:800;white-space:nowrap}
  .bezahlen{min-height:3.4rem;padding:0 1.15rem;border-radius:12px;border:none;background:var(--gruen);color:#fff;font-size:1.15rem;font-weight:800}
  .zeile{gap:.35rem;padding:.5rem .2rem}
  .mb{width:2.6rem;height:2.6rem}
  .zs{width:4.4rem;font-size:.98rem}
  .dlg-hg{padding:0;align-items:stretch}
  .dlg,.dlg.schmal,.dlg.mittel{max-width:none;width:100%;height:100%;max-height:none;border-radius:0;padding:1rem .9rem;padding-top:calc(1rem + env(safe-area-inset-top));padding-bottom:calc(.9rem + env(safe-area-inset-bottom));display:flex;flex-direction:column}
  .dlg h2{font-size:1.25rem;margin-bottom:.7rem}
  .dlg-fuss{position:sticky;bottom:0;margin-top:auto;padding-top:.7rem;background:var(--fl)}
  .dlg-fuss .btn{flex:1 1 auto}
  .zahlung{grid-template-columns:1fr!important;gap:.7rem}
  .feld{padding:.6rem .9rem}
  .feld .lbl{font-size:.8rem}
  .feld .wert{font-size:2.3rem}
  .feld .wert.wg-gross{font-size:2.8rem}
  .art{margin-bottom:.6rem}
  .art button{flex:1 1 0;padding:0 .5rem;font-size:.95rem}
  .schnell{gap:.4rem}
  .schnell button{min-height:3.1rem;font-size:1.15rem}
  .ziffern{gap:.35rem}
  .ziffern button{min-height:2.9rem;font-size:1.3rem}
  #fertig{width:100%;min-height:3.8rem!important;font-size:1.2rem!important}
  .abschluss{padding:.7rem .6rem 2rem}
  .abschluss h2{font-size:1.2rem}
  .ab-raster{grid-template-columns:1fr}
  .karte{padding:.8rem .8rem;border-radius:12px}
  .zaehl{grid-template-columns:1fr 5rem 6rem}
  .ab-knoepfe .btn{flex:1 1 100%}
  table.best thead{display:none}
  table.best,table.best tbody{display:block}
  table.best tr{display:grid;grid-template-columns:1fr 4.6rem 4.6rem;grid-template-areas:"n b e" "p m u";gap:.2rem .4rem;padding:.5rem 0;border-bottom:1px solid var(--rand2)}
  table.best td{border:none;padding:0}
  table.best td.bn{grid-area:n;font-weight:600;align-self:center}
  table.best td.bp{grid-area:p;text-align:left;color:var(--leise);font-size:.85rem}
  table.best td.bm{grid-area:m;font-size:.85rem}
  table.best td.bu{grid-area:u;font-size:.85rem}
  table.best td.bm:not(:empty)::before{content:"verkauft ";color:var(--leise)}
  table.best td input{width:100%!important}
  table.best td:nth-child(3){grid-area:b}
  table.best td:nth-child(4){grid-area:e}
  .verw{flex-direction:column}
  .nav{flex:0 0 auto;flex-direction:row;overflow-x:auto;padding:.4rem .5rem;border-right:none;border-bottom:1px solid var(--rand);gap:.25rem}
  .nav button{flex:0 0 auto;min-height:2.6rem;white-space:nowrap;padding:0 .8rem;font-size:.92rem}
  .nav>div{display:none}
  .inhalt{padding:.8rem .7rem 2rem}
  .inhalt h2{font-size:1.25rem}
  .grid2,.grid3{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}
  .kpi{padding:.6rem .7rem}
  .kpi b{font-size:1.15rem}
  .brow{grid-template-columns:6.5rem 1fr 5.5rem;font-size:.82rem}
  .karte{overflow-x:auto}
  .toast{bottom:calc(6.4rem + env(safe-area-inset-bottom));max-width:92vw;font-size:1rem;padding:.8rem 1.1rem;text-align:center}
}
@media (max-width:380px){
  .kt-text{display:none}
  .msumme{font-size:1.35rem}
  .bezahlen{padding:0 .85rem;font-size:1.05rem}
  .korb-toggle{padding:0 .55rem}
  .wappen{height:2.4rem}
  .vname{font-size:.92rem}
}

</style>

/* ---------- Hilfsfunktionen ---------- */
function $(sel, root) { return (root || document).querySelector(sel); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function uid(p) { return (p || 'id') + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function isInt(n) { return typeof n === 'number' && isFinite(n) && Math.floor(n) === n; }
/* Cent -> "3,50 €" (ohne Gleitkomma) */
function eur(c, ohneZeichen) {
  c = Math.round(Number(c) || 0);
  var neg = c < 0, a = Math.abs(c);
  var euro = Math.floor(a / 100), cent = a % 100;
  var e = String(euro).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  var s = e + ',' + (cent < 10 ? '0' : '') + cent;
  return (neg ? '− ' : '') + s + (ohneZeichen ? '' : ' ' + (DB && DB.settings ? DB.settings.waehrung : '€'));
}
/* "12,5" | "12.50" | "1.234,56" | "12 €" -> Cent (Integer) oder null. Ohne Gleitkomma. */
function parseCents(str) {
  if (str == null) return null;
  var s = String(str).replace(/€|EUR|\s/gi, '');
  if (s === '') return null;
  if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
  if (!/^\d{1,7}(\.\d{0,2})?$/.test(s)) return null;
  var teile = s.split('.');
  var frac = (teile[1] || '');
  frac = (frac + '00').slice(0, 2);
  return parseInt(teile[0], 10) * 100 + parseInt(frac, 10);
}
function centInput(c) { return c == null ? '' : eur(c, true).replace(/\./g, ''); }
function parseIntSafe(s) {
  if (s == null || String(s).trim() === '') return null;
  if (!/^\d{1,6}$/.test(String(s).trim())) return NaN;
  return parseInt(String(s).trim(), 10);
}
function pad(n) { return (n < 10 ? '0' : '') + n; }
function datum(d) { d = d ? new Date(d) : new Date(); return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear(); }
function zeit(d) { d = d ? new Date(d) : new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function isoTag(d) { d = d ? new Date(d) : new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function wochentag(d) { return ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'][new Date(d).getDay()]; }
function jetztIso() {
  var d = new Date(), o = -d.getTimezoneOffset(), sg = o >= 0 ? '+' : '-';
  o = Math.abs(o);

}

/* ---------- Speicher (IndexedDB, Ersatz: localStorage) ---------- */
var DB = null;
var Speicher = {
  idb: null, modus: 'keiner', _timer: null,
  oeffnen: function () {
    var self = this;
    return new Promise(function (ok) {
      if (!window.indexedDB) { self.modus = 'localStorage'; return ok(); }
      try {
        var r = indexedDB.open('svbw90-vereinskasse', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
        r.onsuccess = function () { self.idb = r.result; self.modus = 'IndexedDB'; ok(); };
        r.onerror = function () { self.modus = 'localStorage'; ok(); };
      } catch (e) { self.modus = 'localStorage'; ok(); }
    });
  },
  laden: function () {
    var self = this;
    return new Promise(function (ok) {
      if (self.idb) {
        var tx = self.idb.transaction('kv', 'readonly');
        var g = tx.objectStore('kv').get('daten');
        g.onsuccess = function () { ok(g.result || null); };
        g.onerror = function () { ok(null); };
      } else {
        try { var s = localStorage.getItem('svbw90-vereinskasse'); ok(s ? JSON.parse(s) : null); } catch (e) { ok(null); }
      }
    });
  },
  schreiben: function () {
    var self = this, daten = clone(DB);
    return new Promise(function (ok) {
      if (self.idb) {
        try {
          var tx = self.idb.transaction('kv', 'readwrite');
          tx.objectStore('kv').put(daten, 'daten');
          tx.oncomplete = function () { ok(true); };
          tx.onerror = function () { warnSpeicher(); ok(false); };
        } catch (e) { warnSpeicher(); ok(false); }
      } else {
        try { localStorage.setItem('svbw90-vereinskasse', JSON.stringify(daten)); ok(true); } catch (e) { warnSpeicher(); ok(false); }
      }
    });
  },
  /* verzögert speichern; sofort=true für wichtige Vorgänge */
  merken: function (sofort) {
    var self = this;
    clearTimeout(this._timer);
    if (sofort) return this.schreiben();
    this._timer = setTimeout(function () { self.schreiben(); }, 250);
    return Promise.resolve(true);
  }
};
function warnSpeicher() { toast('Speichern fehlgeschlagen – bitte Datensicherung exportieren!', true); }
function speichern(sofort) { return Speicher.merken(sofort); }

/* Daten nach dem Laden auf Vollständigkeit bringen */
function normalisieren(d) {
  var s = standardDaten();
  if (!d || typeof d !== 'object') return s;
  d.settings = Object.assign({}, s.settings, d.settings || {});
  ['kategorien', 'produkte', 'benutzer', 'abschluesse'].forEach(function (k) { if (!Array.isArray(d[k])) d[k] = s[k]; });
  if (!d.warenkorb || !Array.isArray(d.warenkorb.pos)) d.warenkorb = { pos: [], pfandRueck: 0 };
  if (d.sitzung === undefined) d.sitzung = null;
  d.format = FORMAT; d.version = FORMAT_VERSION;
  return d;
}

/* ---------- SHA-256 (für Prüfsummen) ---------- */
function sha256(text) {
  if (window.crypto && crypto.subtle && crypto.subtle.digest) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function (b) {
      return Array.prototype.map.call(new Uint8Array(b), function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
    }).catch(function () { return null; });
  }
  return Promise.resolve(null);
}

/* ===================== Tagesabschluss (offene Ladenkasse) ===================== */
var STUECKELUNG = [50000, 20000, 10000, 5000, 2000, 1000, 500, 200, 100, 50, 20, 10, 5, 2, 1];
function stLabel(c) { return c >= 100 ? (c / 100) + ' €' : (c >= 10 ? '0,' + c : '0,0' + c) + ' €'; }
function nrText(n) { return String(n).padStart(4, '0'); }

function abschlussRechnung(s) {
  var e = s.entwurf, fehler = [];
  var endCent = 0, zaehlung = {};
  STUECKELUNG.forEach(function (d) {
    var n = parseIntSafe(e.zaehlung[d]);
    if (Number.isNaN(n)) { fehler.push('Zählung ' + stLabel(d)); n = 0; }
    zaehlung[d] = n || 0; endCent += (n || 0) * d;
  });
  var ein = 0, aus = 0;
  s.bewegungen.forEach(function (b) { if (b.storniert) return; if (b.art === 'einlage') ein += b.cent; else aus += b.cent; });
  var karte = e.karte === '' ? 0 : parseCents(e.karte);
  if (karte == null) { fehler.push('Kartenbetrag'); karte = 0; }
  var bb = e.becherBeginn === '' ? null : parseIntSafe(e.becherBeginn);
  var be = e.becherEnde === '' ? null : parseIntSafe(e.becherEnde);
  if (Number.isNaN(bb)) { fehler.push('Becher Beginn'); bb = null; }
  if (Number.isNaN(be)) { fehler.push('Becher Ende'); be = null; }
  var pfandSaldo = (DB.settings.pfandAktiv && bb != null && be != null) ? (bb - be) * DB.settings.pfandCent : null;
  var bareinnahmen = endCent + aus - ein - s.anfangCent;
  var warenBar = bareinnahmen - (pfandSaldo || 0);
  var warenGesamt = warenBar + karte;
  var mengen = [], soll = 0, gezaehlt = 0;
  sortProdukte(DB.produkte).forEach(function (p) {
    var b = s.bestand[p.id] || {};
    var vb = b.beginn === undefined || b.beginn === '' ? null : parseIntSafe(b.beginn);
    var ve = b.ende === undefined || b.ende === '' ? null : parseIntSafe(b.ende);
    if (Number.isNaN(vb) || Number.isNaN(ve)) { fehler.push('Bestand ' + p.name); return; }
    if (vb == null && ve == null) return;
    var m = (vb != null && ve != null) ? vb - ve : null;
    if (m != null && m < 0) fehler.push('Bestand ' + p.name + ': Ende größer als Beginn');
    if (m != null && m >= 0) { soll += m * p.preisCent; gezaehlt++; }
    mengen.push({ pid: p.id, artikelnr: p.artikelnr, name: p.name, kategorie: katName(p.kategorie), preisCent: p.preisCent, beginn: vb, ende: ve, menge: m, umsatzCent: m != null && m >= 0 ? m * p.preisCent : null });
  });
  var hatSoll = gezaehlt > 0;
  var erwartet = hatSoll ? s.anfangCent + ein - aus + (soll - karte + (pfandSaldo || 0)) : null;
  return {
    zaehlung: zaehlung, endCent: endCent, einlagen: ein, entnahmen: aus, karte: karte, becherBeginn: bb, becherEnde: be,
    pfandSaldo: pfandSaldo, bareinnahmen: bareinnahmen, warenBar: warenBar, warenGesamt: warenGesamt,
    mengen: mengen, soll: hatSoll ? soll : null, erwartet: erwartet, differenz: hatSoll ? endCent - erwartet : null, fehler: fehler
  };
}

  if (DB.warenkorb.pos.length || DB.warenkorb.pfandRueck) warn += '\nDie offene Bestellung im Warenkorb wird verworfen.';
  bestaetigen('Tagesabschluss Nr. ' + nrText(DB.settings.letzteAbschlussNr + 1) + ' jetzt festschreiben?\n\nGezählter Bestand: ' + eur(r.endCent) + '\nBareinnahmen: ' + eur(r.bareinnahmen) +

/* Prüfkette der Abschlüsse kontrollieren */
function kettePruefen() {
  var vorher = '', i = 0, l = DB.abschluesse;
  return new Promise(function (ok) {
    (function weiter() {
      if (i >= l.length) return ok({ ok: true });
      var a = l[i], kopie = clone(a), h = kopie.hash; delete kopie.hash;
      if ((a.prevHash || '') !== vorher) return ok({ ok: false, nr: a.nr });
      sha256(vorher + JSON.stringify(kopie)).then(function (x) {
        if (x && h && x !== h) return ok({ ok: false, nr: a.nr });
        if (x && !h) return ok({ ok: false, nr: a.nr });
        vorher = h || ''; i++; weiter();
      });
    })();
  });
}

/* CSV: Semikolon, UTF-8 mit BOM (Excel), Beträge deutsch und in Cent */
function csvText(zeilen) {
  return '﻿' + zeilen.map(function (z) {
    return z.map(function (v) {
      v = v == null ? '' : String(v);
      return /[;"\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    }).join(';');
  }).join('\r\n') + '\r\n';
}
function eurCsv(c) { return c == null ? '' : eur(c, true).replace(/\./g, '').replace('− ', '-'); }
function csvLesen(text) {
  text = text.replace(/^﻿/, '');
  var zeilen = [], z = [], f = '', q = false;
  for (var i = 0; i < text.length; i++) {
    var c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ';') { z.push(f); f = ''; }
    else if (c === '\n') { z.push(f); zeilen.push(z); z = []; f = ''; }
    else if (c !== '\r') f += c;
  }
  if (f !== '' || z.length) { z.push(f); zeilen.push(z); }
  return zeilen.filter(function (r) { return r.some(function (x) { return x.trim() !== ''; }); });
}

  'pfand-rueck': function () { pfandZurueck(1); },
  'pfand-minus': function () { pfandZurueck(-1); },
  'kassieren': function () { zahlungDialog(); },
  'oeffnen': function () { kasseOeffnenDialog(); },
  'oeffnen-ok': function () { kasseOeffnen(); },
  'dlg-zu': function () { dialogZu(); },
  'art': function (el) { DIALOG.art = el.dataset.id; renderDialog(); },
  'schnell': function (el) { DIALOG.eingabe = centInput(+el.dataset.v); var i = $('#erhalten'); if (i) i.value = DIALOG.eingabe; zahlungAktualisieren(); },
  'ziffer': function (el) { ziffer(el.dataset.k); },
  'fertig': function () { zahlungFertig(); },
  'frage-ja': function () { frageAntwort(true); },
  'frage-nein': function () { frageAntwort(false); },
  'zum-verkauf': function () { VIEW = 'verkauf'; render(); },
  'vollbild': function () { vollbild(); },
  'einstellungen': function () { pinDialog('produkte'); },
  'tagesabschluss': function () { if (!DB.sitzung) { toast('Die Kasse ist nicht geöffnet.', true); return; } VIEW = 'abschluss'; render(); },
  'bediener': function () { DIALOG = { typ: 'bediener', bediener: DB.sitzung.bediener }; renderDialog(); },
  'bediener-ok': function () {
    var s = DB.sitzung; s.bediener = DIALOG.bediener; if (s.bedienerListe.indexOf(s.bediener) < 0) s.bedienerListe.push(s.bediener);
    DIALOG = null; speichern(true); render(); renderDialog(); toast('Bediener: ' + s.bediener);
  },
  'bewegung': function () { DIALOG = { typ: 'bewegung', art: 'entnahme', betrag: '', grund: '', fehler: '' }; renderDialog(); },
  'bw-art': function (el) { DIALOG.art = el.dataset.id; renderDialog(); },
  'bw-ok': function () { bewegungSpeichern(); },
  'bw-storno': function (el) {
    var b = DB.sitzung.bewegungen.find(function (x) { return x.id === el.dataset.id; });
    bestaetigen((b.art === 'einlage' ? 'Einlage ' : 'Entnahme ') + eur(b.cent) + ' (' + b.grund + ') stornieren? Der Eintrag bleibt durchgestrichen sichtbar.', 'Stornieren', true).then(function (ja) {
      if (!ja) return; b.storniert = true; b.stornoZeit = jetztIso(); b.stornoBediener = DB.sitzung.bediener; speichern(true); render();
    });
  },
  'pin-z': function (el) { var k = el.dataset.k; if (k === 'C') DIALOG.eingabe = ''; else if (k === '⌫') DIALOG.eingabe = DIALOG.eingabe.slice(0, -1); else if (DIALOG.eingabe.length < 8) DIALOG.eingabe += k; $('#pin').value = DIALOG.eingabe; },
  'pin-ok': function () { pinPruefen(); },
  'ab-vorschau': function () { entwurfDrucken(); },
  'ab-ok': function () { abschlussBestaetigen(); },
  'ab-drucken': function (el) { abschlussDrucken(+el.dataset.nr); },
  /* Verwaltung */
  'verw': function (el) { VERW = el.dataset.id; ADMIN_BIS = Math.max(ADMIN_BIS, Date.now() + 15 * 60 * 1000); render(); },
  'sperren': function () { ADMIN_BIS = 0; VIEW = 'verkauf'; render(); },
  'p-neu': function () { produktDialog(null); },
  'p-edit': function (el) { produktDialog(el.dataset.id); },
  'p-dup': function (el) { produktDialog(el.dataset.id, true); },
  'p-aktiv': function (el) { var p = DB.produkte.find(function (x) { return x.id === el.dataset.id; }); p.aktiv = !p.aktiv; speichern(); render(); },
  'p-hoch': function (el) { produktVerschieben(el.dataset.id, -1); },
  'p-runter': function (el) { produktVerschieben(el.dataset.id, 1); },
  'pd-sym': function (el) { DIALOG.f.symbol = el.dataset.id; DIALOG.f.bild = null; renderDialog(); },
  'pd-bild-weg': function () { DIALOG.f.bild = null; renderDialog(); },
  'pd-ok': function () { produktSpeichern(); },
  'p-sammel': function () { DIALOG = { typ: 'sammel', kat: '', art: 'betrag', wert: '', runden: false }; renderDialog(); },
  'sa-ok': function () {
    var n = DIALOG._neu || [];
    bestaetigen(n.length + ' Preise ändern? Offene Bestellungen behalten ihren Preis.', 'Preise ändern').then(function (ja) {
      if (!ja) return; n.forEach(function (x) { if (x[0].preisCent !== x[1]) { x[0].preisCent = x[1]; x[0].beispielpreis = false; } });
      DIALOG = null; speichern(true); render(); renderDialog(); toast('Preise angepasst');
    });
  },
  'p-export-csv': function () { produkteExportCsv(); },
  'p-export-json': function () { produkteExportJson(); },
  'p-import': function () { var i = document.createElement('input'); i.type = 'file'; i.accept = '.json,.csv'; i.onchange = function () { if (i.files[0]) importDatei(i.files[0], 'produkte'); }; i.click(); },
  'pi-modus': function (el) { DIALOG.modus = el.dataset.id; renderDialog(); },
  'pi-ok': function () {
    if (DIALOG.modus === 'ersetzen') bestaetigen('Alle bisherigen Produkte entfernen und durch die importierte Liste ersetzen?', 'Ersetzen', true).then(function (ja) { if (ja) importProdukteAusfuehren(); });
    else importProdukteAusfuehren();
  },
  'k-hoch': function (el) { kategorieVerschieben(el.dataset.id, -1); },
  'k-runter': function (el) { kategorieVerschieben(el.dataset.id, 1); },
  'k-aktiv': function (el) { var k = DB.kategorien.find(function (x) { return x.id === el.dataset.id; }); k.aktiv = !k.aktiv; speichern(); render(); },
  'k-del': function (el) {
    var k = DB.kategorien.find(function (x) { return x.id === el.dataset.id; });
    if (DB.produkte.some(function (p) { return p.kategorie === k.id; })) { toast('Kategorie enthält Produkte – bitte deaktivieren.', true); return; }
    bestaetigen('Kategorie „' + k.name + '“ löschen?', 'Löschen', true).then(function (ja) { if (ja) { DB.kategorien = DB.kategorien.filter(function (x) { return x !== k; }); speichern(); render(); } });
  },
  'k-neu': function () {
    var v = $('#k-neu').value.trim(); if (!v) return;
    if (DB.kategorien.some(function (k) { return k.name.toLowerCase() === v.toLowerCase(); })) { toast('Diese Kategorie gibt es schon.', true); return; }
    DB.kategorien.push({ id: uid('k'), name: v, reihenfolge: DB.kategorien.length + 1, aktiv: true }); speichern(); render();
  },
  'u-neu': function () { var v = $('#u-neu').value.trim(); if (!v) return; DB.benutzer.push({ id: uid('u'), name: v, rolle: 'ausschank' }); speichern(); render(); },
  'u-del': function (el) {
    var b = DB.benutzer.find(function (x) { return x.id === el.dataset.id; });
    bestaetigen('Benutzer „' + b.name + '“ entfernen? Frühere Abschlüsse behalten den Namen.', 'Entfernen', true).then(function (ja) { if (ja) { DB.benutzer = DB.benutzer.filter(function (x) { return x !== b; }); speichern(); render(); } });
  },
  'logo-reset': function () { DB.settings.logo = null; speichern(); render(); },
  'pin-neu': function () {
    var v = $('#pin-neu').value.trim();
    if (!/^\d{4,8}$/.test(v)) { toast('Die PIN muss aus 4 bis 8 Ziffern bestehen.', true); return; }
    DB.settings.adminPin = v; DB.settings.pinGeaendert = true; speichern(true); render(); toast('PIN geändert');
  },
  'st-z': function (el) { statZeitraum(el.dataset.id); render(); },
  'st-csv': function () { statistikCsv(); },
  'a-csv': function () { abschluesseCsv(); },
  'bw-csv': function () { bewegungenCsv(); },
  'kette': function () {
    kettePruefen().then(function (r) {
      var e = $('#kette-erg'); if (!e) return;
      e.innerHTML = r.ok ? '<b style="color:var(--gruen)">Prüfkette in Ordnung (' + DB.abschluesse.length + ' Abschlüsse).</b>' : '<b style="color:var(--rot)">Abweichung ab Abschluss Nr. ' + nrText(r.nr) + ' – Daten wurden verändert.</b>';
    });
  },
  'sicherung-export': function () { sicherungExportieren(); },
  'import-ok': function () { importVollAusfuehren(); },
  'reset': function () {
    bestaetigen('Wirklich ALLE Daten auf diesem Gerät löschen?\nProdukte, Einstellungen, offene Kasse und ' + DB.abschluesse.length + ' Tagesabschlüsse gehen verloren.', 'Weiter', true).then(function (ja) {
      if (!ja) return;
      bestaetigen('Letzte Rückfrage: Ist eine aktuelle Datensicherung vorhanden?', 'Ja, alles löschen', true).then(function (ja2) {
        if (!ja2) return; DB = standardDaten(); designAnwenden(); speichern(true); VIEW = 'verkauf'; ADMIN_BIS = 0; render(); toast('Alle Daten gelöscht');
      });
    });
  }
};
document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-a]');
  if (!el || el.disabled) return;
  if (Date.now() < _klickSperreBis) { ev.preventDefault(); return; }
  var f = AKTION[el.dataset.a];
  if (!f) return;
  ev.preventDefault();
  if (DIALOG && DIALOG.typ === 'menue' && el.closest('.menueliste')) { DIALOG = null; renderDialog(); }
  if (el.dataset.a === 'tagesabschluss' || el.dataset.a === 'einstellungen' || el.dataset.a === 'zum-verkauf') KORB_OFFEN = false;
  f(el);
});

/* ===================== Eingaben ===================== */
function eingabe(ev) {
  var el = ev.target, f = el.dataset ? el.dataset.f : null;
  if (ev.target.id === 'erhalten' && DIALOG && DIALOG.typ === 'zahlung') { DIALOG.eingabe = el.value; zahlungAktualisieren(); return; }
  if (ev.target.id === 'pin' && DIALOG && DIALOG.typ === 'pin') { DIALOG.eingabe = el.value.replace(/\D/g, '').slice(0, 8); return; }
  if (!f) return;
  var wert = el.type === 'checkbox' ? el.checked : el.value;
  switch (f) {
    case 'karteOk': DIALOG.karteOk = wert; zahlungAktualisieren(); break;
    case 'bediener': case 'veranstaltung': case 'anfang': case 'becher': case 'betrag': case 'grund': if (DIALOG) DIALOG[f] = wert; break;
    case 'ab-z': DB.sitzung.entwurf.zaehlung[el.dataset.d] = wert.trim(); el.classList.toggle('fehler', Number.isNaN(parseIntSafe(wert))); speichern(); renderAbschlussErgebnis(); break;
    case 'ab-e': DB.sitzung.entwurf[el.dataset.k] = el.dataset.k === 'bemerkung' ? wert : wert.trim(); speichern(); renderAbschlussErgebnis(); break;
    case 'ab-best':
      var b = DB.sitzung.bestand[el.dataset.id] = DB.sitzung.bestand[el.dataset.id] || {};
      b[el.dataset.w] = wert.trim(); el.classList.toggle('fehler', Number.isNaN(parseIntSafe(wert))); speichern(); renderAbschlussErgebnis(); break;
    case 'pd': DIALOG.f[el.dataset.k] = wert; break;
    case 'sa': DIALOG[el.dataset.k] = wert; var v = sammelVorschau(); $('#sa-vorschau').innerHTML = v.html; $('[data-a="sa-ok"]').disabled = !v.ok; break;
    case 'k-name': if (ev.type === 'change') { var k = DB.kategorien.find(function (x) { return x.id === el.dataset.id; }); if (wert.trim()) { k.name = wert.trim(); speichern(); } else el.value = k.name; } break;
    case 'u-name': if (ev.type === 'change') { var u = DB.benutzer.find(function (x) { return x.id === el.dataset.id; }); if (wert.trim()) { u.name = wert.trim(); speichern(); } else el.value = u.name; } break;
    case 'u-rolle': DB.benutzer.find(function (x) { return x.id === el.dataset.id; }).rolle = wert; speichern(); break;
    case 's':
      if (ev.type !== 'change' && el.type !== 'checkbox' && el.tagName !== 'SELECT') { DB.settings[el.dataset.k] = wert; speichern(); var vn = $('.vname'); if (vn && el.dataset.k === 'vereinsname') vn.textContent = wert; break; }
      if (ev.type === 'change' || el.type === 'checkbox' || el.tagName === 'SELECT') {
        DB.settings[el.dataset.k] = typeof wert === 'string' && el.tagName !== 'SELECT' ? (wert.trim() || DB.settings[el.dataset.k]) : wert;
        speichern(); designAnwenden(); render();
      }
      break;
    case 's-cent': if (ev.type === 'change') { var c = parseCents(wert); if (c == null) { toast('Ungültiger Betrag.', true); el.value = centInput(DB.settings.pfandCent); } else { DB.settings[el.dataset.k] = c; speichern(); } } break;
    case 's-schnell': if (ev.type === 'change') {
      var l = wert.split(/[;\s]+/).filter(Boolean).map(parseCents);
      if (!l.length || l.some(function (x) { return x == null || x <= 0; })) { toast('Bitte Beträge wie 5; 10; 20; 50; 100 eingeben.', true); }
      else { DB.settings.schnellwahl = l.sort(function (a, b) { return a - b; }); speichern(); }
      render();
    } break;
    case 'st': if (ev.type === 'change') { STAT[el.dataset.k] = wert; STAT._init = true; render(); } break;
  }
}
document.addEventListener('input', eingabe);
document.addEventListener('change', function (ev) {
  var el = ev.target, f = el.dataset ? el.dataset.f : null;
  if (f === 'pd-bild' && el.files[0]) { bildVerkleinern(el.files[0]).then(function (u) { DIALOG.f.bild = u; renderDialog(); }).catch(function (e) { toast(e.message, true); }); return; }
  if (f === 'logo' && el.files[0]) {
    var r = new FileReader();
    r.onload = function () {
      var img = new Image();
      img.onload = function () { var s = Math.min(1, 900 / img.width), c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); DB.settings.logo = c.toDataURL('image/png'); speichern(true); render(); toast('Wappen ausgetauscht'); };
      img.onerror = function () { toast('Bild konnte nicht gelesen werden.', true); };
      img.src = r.result;
    };
    r.readAsDataURL(el.files[0]); return;
  }
  if (f === 'import-voll' && el.files[0]) { importDatei(el.files[0], 'voll'); el.value = ''; return; }
  eingabe(ev);
});
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape') { if (FRAGE) frageAntwort(false); else if (DIALOG && DIALOG.typ !== 'abgeschlossen') dialogZu(); }
  if (ev.key === 'Enter' && DIALOG && !FRAGE) {
    if (DIALOG.typ === 'zahlung') { ev.preventDefault(); zahlungFertig(); }
    else if (DIALOG.typ === 'pin') { ev.preventDefault(); pinPruefen(); }
  }
  if (ev.key === 'Enter' && FRAGE && ev.target.tagName !== 'BUTTON') { ev.preventDefault(); frageAntwort(true); }
});
window.addEventListener('beforeunload', function () { Speicher.schreiben(); });

/* ===================== Start ===================== */
Speicher.oeffnen().then(function () { return Speicher.laden(); }).then(function (d) {
  DB = normalisieren(d);
  designAnwenden(); render(); speichern();
  if (!DB.sitzung) kasseOeffnenDialog();
  pwaStarten();
});


</script>
